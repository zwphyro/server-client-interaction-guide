x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:?}
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}

services:
  frontend:
    container_name: frontend
    image: server_client_integration_guide_frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-3000}:3000
    restart: always
    networks:
      - default_network
    logging: *default-logging

  backend:
    container_name: backend
    image: server_client_integration_guide_backend
    build:
      context: apps/backend
      dockerfile: Dockerfile
    environment: *backend-env
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
    restart: always
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
    networks:
      - default_network
    logging: *default-logging

  backend_migrate:
    container_name: backend_migrate
    image: server_client_integration_guide_backend
    build:
      context: apps/backend
      dockerfile: Dockerfile
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default_network
    logging: *default-logging

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "postgres", "-U", "${POSTGRES_USER}", "-q"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    networks:
      - default_network
    logging: *default-logging

volumes:
  postgres_data:

networks:
  default_network:
    driver: bridge
