x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?}
      - POSTGRES_USER=${POSTGRES_USER:?}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD", "pg_isready", "-d", "postgres", "-U", "${POSTGRES_USER}", "-q"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always
    networks:
      - default_network
    logging: *default-logging

volumes:
  postgres_data:

networks:
  default_network:
    driver: bridge
